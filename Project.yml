name: iTricks
options:
  bundleIdPrefix: com.itricks.app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: "YES"
targets:
  iTricks:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iTricks
    info:
      path: iTricks/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "iTricks necesita la cámara para los efectos que utilizan visión por computador, como la lectura de objetos o cartas."
        NSMicrophoneUsageDescription: "iTricks necesita el micrófono para los efectos que reaccionan a la voz o al sonido del entorno."
        NSFaceIDUsageDescription: "iTricks puede usar Face ID para desbloquear configuraciones secretas de mago de forma discreta."
        NSLocationWhenInUseUsageDescription: "iTricks usa la brújula del dispositivo para los efectos que detectan variaciones magnéticas del entorno."
        NSAppleMusicUsageDescription: "iTricks puede buscar y reproducir canciones de tu biblioteca para el efecto de telepatía musical."
        NSPhotoLibraryUsageDescription: "iTricks necesita acceso a tus fotos para que elijas la imagen que se usará en algunos efectos."
        ITSAppUsesNonExceptionEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itricks.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  iTricks:
    build:
      targets:
        iTricks: all
    run:
      config: Debug
